<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1A1A">
  <title>Barbería El Filo | Tradición y estilo</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --oscuro: #1A1A1A;
      --dorado: #F0B429;
      --texto: #5C6269;
      --ayuda: #6C737A;
      --fondo: #FFFFFF;
      --fondo-pie: #F4F5F7;
      --borde: #767D84;
      --foco: #1769AA;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Verdana, Geneva, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.6;
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 3px solid var(--foco);
      outline-offset: 4px;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 12px;
      z-index: 10;
      padding: 10px;
      background: #FFFFFF;
      color: var(--oscuro);
    }

    .skip-link:focus { top: 12px; }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      padding: 14px 20px;
      background: var(--oscuro);
      color: #FFFFFF;
    }

    .logo {
      color: var(--dorado);
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px
